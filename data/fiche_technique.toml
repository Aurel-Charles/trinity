# Fiche technique — affichée sur /fiche-technique/
# Modifiable depuis l'admin (Pages > Fiche technique) ou directement ici.

fichier_excel = "/fiche-technique/the-trinities-fiche-technique.xlsx"
mise_a_jour = "2026-11-09"

[groupe]
nom = "The Trinities"
style = "Reggae"
musiciens = 5
duree_set = "40 min"
note = "Configuration optimale décrite dans cette fiche — nous nous adaptons volontiers au matériel et aux contraintes de la salle. N'hésitez pas à nous contacter avant le jour J."

# Téléphones et email : uniquement dans le fichier Excel téléchargeable (pas sur la page)
[contact]
nom = "Aurélien CHARLES"

# Code couleur : chaque musicien a une couleur reprise dans les tableaux et le plan
[[musiciens]]
id = "thomas"
nom = "Thomas"
role = "Chant / Guitare"
couleur = "#BFDBFE"

[[musiciens]]
id = "jf"
nom = "JF"
role = "Batterie"
couleur = "#BBF7D0"

[[musiciens]]
id = "stephane"
nom = "Stéphane"
role = "Clavier 1"
couleur = "#FBCFE8"

[[musiciens]]
id = "julien"
nom = "Julien"
role = "Clavier 2 / Sampler / Mélodica"
couleur = "#DDD6FE"

[[musiciens]]
id = "aurelien"
nom = "Aurélien"
role = "Basse"
couleur = "#FED7AA"

# ---------- Line-up sur scène ----------
[[lineup]]
poste = "Chant lead"
musicien = "thomas"
instrument = "Voix"
ampli = "Micro chant sur grand pied — fourni par la salle"

[[lineup]]
poste = "Guitare"
musicien = "thomas"
instrument = "Guitare électrique + pédalier"
ampli = "Ampli guitare type Twin Reverb — fourni par la salle (backline)"
notes = "Le groupe apporte sa guitare et son pédalier"

[[lineup]]
poste = "Basse"
musicien = "aurelien"
instrument = "Basse électrique"
ampli = "Ampli basse type Ampeg (backline salle) + DI"
notes = "Le groupe apporte sa basse — repiquage DI + micro devant l'ampli"

[[lineup]]
poste = "Batterie"
musicien = "jf"
instrument = "Batterie acoustique complète"
ampli = "Kit standard fourni par la salle + micro chant"
notes = "Gr. caisse, caisse claire, 2 toms, charley, 2 cymbales + micros standards. JF chante : micro sur perche courte"

[[lineup]]
poste = "Clavier 1"
musicien = "stephane"
instrument = "Clavier / synthé (sortie stéréo)"
ampli = "Sortie ligne — DI fournie par la salle"

[[lineup]]
poste = "Clavier 2"
musicien = "julien"
instrument = "Clavier / synthé (sortie stéréo)"
ampli = "Sortie ligne — DI fournie par la salle + micro chant"
notes = "Julien chante : micro sur perche courte"

[[lineup]]
poste = "Sampler"
musicien = "julien"
instrument = "Sampler stéréo"
ampli = "Sortie ligne — DI fournie par la salle"

[[lineup]]
poste = "Mélodica"
musicien = "julien"
instrument = "Mélodica"
ampli = "Micro instrument (SM57) — fourni par la salle"

# ---------- Matériel demandé à la salle ----------
# quantite : un nombre, ou "auto" pour les éléments comptés à partir de la patch list / des retours
[[backline]]
element = "Batterie complète"
quantite = "1"
detail = "Gr. caisse, caisse claire, 2 toms, charley, 2 cymbales + pieds + tabouret"

[[backline]]
element = "Ampli guitare"
quantite = "1"
detail = "Type Fender Twin Reverb (ou équivalent combo lampes)"

[[backline]]
element = "Ampli basse"
quantite = "1"
detail = "Type Ampeg (tête + baffle ou combo, ex : SVT / Rocket Bass)"

[[backline]]
element = "Boîtes de direct (DI)"
quantite = "auto"
compter = "di"
detail = "Claviers (x2 stéréo), sampler stéréo, basse"

[[backline]]
element = "Grands pieds de micro (perche)"
quantite = "auto"
compter = "grand_pied"
detail = "Chant lead, chant clavier 2 (Julien), mélodica, overheads batterie (x2)"

[[backline]]
element = "Petits pieds de micro (perche courte)"
quantite = "auto"
compter = "petit_pied"
detail = "Grosse caisse, charley, caisse claire (si pas de pince), ampli guitare, ampli basse, chant batteur (JF)"

[[backline]]
element = "Retours de scène (wedges)"
quantite = "auto"
compter = "retours"
detail = "1 wedge par musicien : Thomas (chant/guitare), Aurélien, JF, Stéphane, Julien"
notes = "5 circuits indépendants si possible"

[[backline]]
element = "Alimentation électrique au plateau"
quantite = "5"
detail = "5 points 230 V : guitare (ampli + pédalier), basse (ampli), clavier 1, clavier 2, sampler — rien côté batterie"
notes = "Multiprises + rallonges souhaitées. Aucune alimentation nécessaire à la batterie."

