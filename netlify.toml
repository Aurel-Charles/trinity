[build]
  # Commande pour générer le site :
  # 1. mesure la durée des enregistrements de static/songs/ → data/audio.toml
  # 2. construit le site avec Hugo (minifié)
  command = "node scripts/maj-durees-audio.mjs && hugo --gc --minify"
  # Dossier où Hugo génère le site (par défaut 'public')
  publish = "public"

[build.environment]
  # Spécifiez votre version de Hugo ici (ex: 0.121.2)
  # Très important pour éviter les erreurs de build si vous utilisez des fonctions récentes
  HUGO_VERSION = "0.151.0"
  # Optionnel : force l'utilisation de Hugo Extended si vous utilisez SASS/SCSS
  HUGO_ENABLEGITINFO = "true"

