# ==============================================================================
# DECAP CMS — The Trinities
# Interface d'admin du site : /admin
# ==============================================================================

locale: "fr"
local_backend: true          # en local : lancer `npx decap-server` à côté de `hugo server`

media_folder: static/images/uploads
public_folder: /images/uploads

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# Connexion via DecapBridge
backend:
  name: git-gateway
  repo: Aurel-Charles/trinity
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/50fffadf-9d37-4d59-a583-1de2275c6dd2/pkce
  auth_token_endpoint: /sites/50fffadf-9d37-4d59-a583-1de2275c6dd2/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Création {{collection}} « {{slug}} » — {{author-name}} via Decap
    update: Modif {{collection}} « {{slug}} » — {{author-name}} via Decap
    delete: Suppression {{collection}} « {{slug}} » — {{author-name}} via Decap
    uploadMedia: Ajout fichier « {{path}} » — {{author-name}} via Decap
    deleteMedia: Suppression fichier « {{path}} » — {{author-name}} via Decap
    openAuthoring: "{{message}} — {{author-name}} via Decap"

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

site_url: https://trinityband.netlify.app
display_url: https://trinityband.netlify.app
logo_url: /admin/logo.svg

# ==============================================================================
# COLLECTIONS
# ==============================================================================

collections:

  # ----------------------------------------------------------------------------
  # CHANSONS
  # ----------------------------------------------------------------------------
  - name: "chansons"
    label: "Chansons"
    label_singular: "chanson"
    description: "Le répertoire du groupe : grilles d'accords, paroles, notes par instrument et enregistrements de répète."
    folder: "content/chansons"
    filter: {field: "fiche", value: "chanson"}   # n'affiche que les fiches chansons (pas _index.md)
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"
    extension: "md"
    format: "toml-frontmatter"
    summary: "{{title}} — {{tonalite}} · {{tempo}} BPM"
    sortable_fields: ["title", "statut", "tonalite", "tempo", "date"]
    editor:
      preview: false
    view_filters:
      - {label: "Validées", field: statut, pattern: "validee"}
      - {label: "En cours", field: statut, pattern: "en_cours"}
      - {label: "Idées", field: statut, pattern: "idee"}
      - {label: "Brouillons", field: draft, pattern: true}
    view_groups:
      - {label: "Statut", field: statut}
      - {label: "Tonalité", field: tonalite}

    fields:
      - {label: "Type de fiche", name: "fiche", widget: "hidden", default: "chanson"}
      # ---------- Infos ----------
      - label: "Titre"
        name: "title"
        widget: "string"

      - label: "Statut"
        name: "statut"
        widget: "select"
        default: "idee"
        hint: "Validée = prête pour la scène. En cours = on la travaille. Idée = à explorer."
        options:
          - {label: "✔ Validée", value: "validee"}
          - {label: "◐ En cours", value: "en_cours"}
          - {label: "○ Idée", value: "idee"}

      - label: "Artiste / compositeur"
        name: "artiste"
        widget: "string"
        default: "Original"
        required: false
        hint: "« Original » pour nos compos, sinon le nom de l'artiste repris."

      - label: "Tonalité"
        name: "tonalite"
        widget: "select"
        default: "C"
        options: ["C", "C#", "Db", "D", "Eb", "E", "F", "F#", "Gb", "G", "Ab", "A", "Bb", "B",
                  "Cm", "C#m", "Dm", "D#m", "Ebm", "Em", "Fm", "F#m", "Gm", "G#m", "Abm", "Am", "A#m", "Bbm", "Bm"]

      - label: "Tempo (BPM)"
        name: "tempo"
        widget: "number"
        value_type: "int"
        min: 30
        max: 240
        default: 80

      - label: "Durée estimée"
        name: "duree"
        widget: "string"
        required: false
        pattern: ['^\d{1,2}:[0-5]\d$', "Format minutes:secondes, par ex. 3:45"]
        hint: "Format 3:45. Remplacée automatiquement par la durée réelle dès qu'un enregistrement est ajouté."

      - label: "Difficulté"
        name: "difficulte"
        widget: "select"
        default: 2
        options:
          - {label: "1 — Très facile", value: 1}
          - {label: "2 — Facile", value: 2}
          - {label: "3 — Moyen", value: 3}
          - {label: "4 — Difficile", value: 4}
          - {label: "5 — Très difficile", value: 5}

      - label: "Capo"
        name: "capo"
        widget: "number"
        value_type: "int"
        min: 0
        max: 12
        default: 0
        hint: "Case du capodastre (0 = pas de capo)."

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        allow_add: true
        hint: "Style, ambiance… Sépare par des virgules : roots, one drop, original"

      # ---------- Structure + grilles ----------
      - label: "Structure du morceau"
        name: "structure"
        widget: "list"
        required: false
        allow_add: true
        hint: "L'ordre des parties, séparées par des virgules : Couplet, Refrain, Couplet, Refrain, Pont. Utilise les mêmes noms que les grilles ci-dessous."

      - label: "Grilles d'accords"
        name: "grilles"
        widget: "list"
        label_singular: "grille"
        required: false
        collapsed: true
        allow_add: true
        allow_remove: true
        allow_reorder: true
        summary: "{{fields.nom}} — {{fields.pattern}}"
        hint: "Une grille par partie (Couplet, Refrain, Partie A…). Chaque accord peut durer plusieurs mesures."
        fields:
          - label: "Nom de la partie"
            name: "nom"
            widget: "string"
            hint: "Ex. Couplet, Refrain, Pont, Partie A"
          - label: "Accords"
            name: "mesures"
            widget: "list"
            label_singular: "accord"
            allow_add: true
            allow_remove: true
            allow_reorder: true
            collapsed: false
            summary: "{{fields.accord}} × {{fields.nombre}}"
            hint: "Dans l'ordre. « Nombre de mesures » = combien de mesures on reste sur cet accord."
            fields:
              - {label: "Accord", name: "accord", widget: "string", hint: "Ex. Am, F7, C#m7, A7+"}
              - {label: "Nombre de mesures", name: "nombre", widget: "number", value_type: "int", min: 1, max: 32, default: 1}
          - label: "Rythmique"
            name: "pattern"
            widget: "string"
            required: false
            default: "↓ ↓↑ ↓↑ ↓↑"
            hint: "Ex. ↓ ↓↑ ↓↑ ↓↑, skank, one drop…"
          - label: "Notes"
            name: "notes"
            widget: "text"
            required: false

      # ---------- Paroles ----------
      - label: "Paroles"
        name: "paroles"
        widget: "list"
        label_singular: "partie de paroles"
        required: false
        collapsed: true
        allow_add: true
        allow_remove: true
        allow_reorder: true
        summary: "{{fields.section}}"
        hint: "Dans l'ordre où on les chante. Une ligne = une ligne de paroles."
        fields:
          - {label: "Partie", name: "section", widget: "string", hint: "Ex. Couplet 1, Refrain, Pont"}
          - {label: "Texte", name: "texte", widget: "text"}

      # ---------- Instruments ----------
      - label: "Notes par instrument"
        name: "instruments"
        widget: "list"
        label_singular: "instrument"
        required: false
        collapsed: true
        allow_add: true
        allow_remove: true
        allow_reorder: true
        summary: "{{fields.instrument}} — {{fields.role}}"
        fields:
          - label: "Instrument"
            name: "instrument"
            widget: "select"
            options: ["Guitare", "Basse", "Piano / clavier", "Orgue", "Batterie", "Percussions", "Voix", "Chœurs", "Cuivres", "Autre"]
          - {label: "Rôle", name: "role", widget: "string", required: false, hint: "Ex. Skank, One drop, Walking bass"}
          - {label: "Notes", name: "notes", widget: "text", required: false}

      # ---------- Enregistrements ----------
      - label: "Enregistrements"
        name: "enregistrements"
        widget: "list"
        label_singular: "enregistrement"
        required: false
        collapsed: true
        allow_add: true
        allow_remove: true
        summary: "{{fields.date}} — {{fields.titre}}"
        hint: "Le plus récent est joué en premier sur le site, et sa durée devient la durée du morceau."
        fields:
          - {label: "Titre", name: "titre", widget: "string", default: "Répète"}
          - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: true}
          - {label: "Fichier audio (MP3 de préférence)", name: "url", widget: "file", media_folder: "/static/songs", public_folder: "/songs", choose_url: false}

      # ---------- Divers ----------
      - label: "Notes libres"
        name: "body"
        widget: "markdown"
        required: false
        buttons: ["bold", "italic", "link", "heading-three", "bulleted-list", "numbered-list"]
        editor_components: []
        hint: "Affichées en bas de la fiche."

      - label: "Date d'ajout"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        picker_utc: true

      - label: "Brouillon (cachée du site)"
        name: "draft"
        widget: "boolean"
        default: false
        required: false

  # ----------------------------------------------------------------------------
  # SETLISTS
  # ----------------------------------------------------------------------------
  - name: "setlists"
    label: "Setlists"
    label_singular: "setlist"
    description: "Les concerts : date, lieu et ordre des morceaux. La durée totale est calculée automatiquement."
    folder: "content/setlists"
    filter: {field: "fiche", value: "setlist"}   # n'affiche que les setlists (pas _index.md)
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "toml-frontmatter"
    summary: "{{date}} — {{title}} ({{lieu}})"
    sortable_fields: ["date", "title"]
    editor:
      preview: false
    fields:
      - {label: "Type de fiche", name: "fiche", widget: "hidden", default: "setlist"}
      - {label: "Nom du concert", name: "title", widget: "string", hint: "Ex. Lune des Pirates, Fête de la musique 2027"}
      - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: true}
      - {label: "Heure de début", name: "heure_debut", widget: "string", required: false, pattern: ['^\d{1,2}[:h]\d{2}$', "Format 20:00"], hint: "Ex. 20:00"}
      - {label: "Lieu", name: "lieu", widget: "string", required: false, hint: "Ex. La Lune des Pirates, Amiens"}
      - {label: "Adresse", name: "adresse", widget: "text", required: false, hint: "Une ligne par élément : salle, rue, code postal et ville. Un lien « Itinéraire » est ajouté automatiquement."}
      - {label: "Carte Google Maps", name: "carte", widget: "text", required: false, hint: "Dans Google Maps : Partager → Intégrer une carte → Copier le HTML, puis coller ici (tout le code, ou juste le lien)."}

      - label: "Programme"
        name: "chansons"
        widget: "list"
        label_singular: "morceau"
        allow_add: true
        allow_remove: true
        allow_reorder: true
        collapsed: true
        summary: "{{fields.slug}} {{fields.notes}}"
        hint: "Dans l'ordre du concert. Glisse les morceaux pour changer l'ordre."
        fields:
          - label: "Morceau"
            name: "slug"
            widget: "relation"
            collection: "chansons"
            value_field: "{{slug}}"
            search_fields: ["title"]
            display_fields: ["{{title}} — {{tonalite}} · {{statut}}"]
            options_length: 100
          - label: "Tonalité pour ce concert"
            name: "tonalite_live"
            widget: "select"
            required: false
            hint: "Seulement si on la joue dans une autre tonalité que d'habitude."
            options: ["C", "C#", "Db", "D", "Eb", "E", "F", "F#", "Gb", "G", "Ab", "A", "Bb", "B",
                      "Cm", "C#m", "Dm", "D#m", "Ebm", "Em", "Fm", "F#m", "Gm", "G#m", "Abm", "Am", "A#m", "Bbm", "Bm"]
          - {label: "Note pour ce concert", name: "notes", widget: "string", required: false, hint: "Ex. Ouverture en douceur, version courte, sans intro"}

      - {label: "Note générale", name: "notes_generales", widget: "text", required: false, hint: "Affichée à côté de la setlist."}
      - {label: "Brouillon (cachée du site)", name: "draft", widget: "boolean", default: false, required: false}

  # ----------------------------------------------------------------------------
  # PAGES
  # ----------------------------------------------------------------------------
  - name: "pages"
    label: "Pages"
    description: "Textes des pages du site."
    delete: false
    editor:
      preview: false
    files:
      - label: "Accueil"
        name: "home"
        file: "content/_index.md"
        format: "toml-frontmatter"
        fields:
          - {label: "Nom du groupe", name: "title", widget: "string"}
          - {label: "Description (Google, partages)", name: "description", widget: "string", required: false, hint: "Une phrase de 150 caractères environ."}
          - {label: "Texte d'introduction", name: "body", widget: "markdown", required: false, buttons: ["bold", "italic", "link"], editor_components: []}

      - label: "Fiche technique"
        name: "fiche_technique"
        file: "data/fiche_technique.toml"
        format: "toml"
        description: "Tout ce qui est affiché sur la page /fiche-technique/."
        fields:
          - {label: "Fichier Excel à télécharger", name: "fichier_excel", widget: "file", media_folder: "/static/fiche-technique", public_folder: "/fiche-technique", choose_url: false, hint: "Remplace le fichier proposé par le bouton « Télécharger la fiche »."}
          - {label: "Date de mise à jour", name: "mise_a_jour", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: true}
          - label: "Groupe"
            name: "groupe"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Nom", name: "nom", widget: "string"}
              - {label: "Style", name: "style", widget: "string"}
              - {label: "Nombre de musiciens", name: "musiciens", widget: "number", value_type: "int", min: 1}
              - {label: "Durée du set", name: "duree_set", widget: "string", hint: "Ex. 40 min"}
              - {label: "Note (encadré)", name: "note", widget: "text", required: false}
          - label: "Contact"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Nom", name: "nom", widget: "string", hint: "Seul le nom est affiché. Téléphones et email restent uniquement dans le fichier Excel."}
          - label: "Musiciens (code couleur)"
            name: "musiciens"
            widget: "list"
            label_singular: "musicien"
            collapsed: true
            summary: "{{fields.nom}} — {{fields.role}}"
            hint: "L'identifiant sert à relier les lignes des tableaux et du plan à un musicien."
            fields:
              - {label: "Identifiant (minuscules, sans espace)", name: "id", widget: "string", pattern: ['^[a-z0-9_-]+$', "Minuscules, chiffres, - ou _ uniquement"]}
              - {label: "Prénom", name: "nom", widget: "string"}
              - {label: "Rôle", name: "role", widget: "string"}
              - {label: "Couleur", name: "couleur", widget: "color", default: "#DDD6FE"}
          - label: "Line-up sur scène"
            name: "lineup"
            widget: "list"
            label_singular: "poste"
            collapsed: true
            summary: "{{fields.poste}} — {{fields.musicien}}"
            fields:
              - {label: "Poste", name: "poste", widget: "string"}
              - {label: "Musicien (identifiant)", name: "musicien", widget: "string", hint: "Ex. thomas, jf, stephane, julien, aurelien"}
              - {label: "Instrument / matériel", name: "instrument", widget: "string"}
              - {label: "Amplification demandée", name: "ampli", widget: "string", required: false}
              - {label: "Notes", name: "notes", widget: "text", required: false}
          - label: "Matériel demandé à la salle"
            name: "backline"
            widget: "list"
            label_singular: "élément"
            collapsed: true
            summary: "{{fields.element}} ({{fields.quantite}})"
            fields:
              - {label: "Élément", name: "element", widget: "string"}
              - {label: "Quantité", name: "quantite", widget: "string", hint: "Un nombre, ou « auto » pour compter automatiquement (voir ci-dessous)."}
              - label: "Compter automatiquement"
                name: "compter"
                widget: "select"
                required: false
                options:
                  - {label: "Boîtes DI (patch list)", value: "di"}
                  - {label: "Grands pieds (patch list)", value: "grand_pied"}
                  - {label: "Petits pieds (patch list)", value: "petit_pied"}
                  - {label: "Retours de scène", value: "retours"}
              - {label: "Détail", name: "detail", widget: "text", required: false}
              - {label: "Notes", name: "notes", widget: "text", required: false}
          - label: "Patch list"
            name: "patch"
            widget: "list"
            label_singular: "voie"
            collapsed: true
            summary: "{{fields.source}} — {{fields.micro}}"
            hint: "Les numéros de voie suivent l'ordre de la liste."
            fields:
              - {label: "Source", name: "source", widget: "string"}
              - {label: "Instrument", name: "instrument", widget: "string", required: false}
              - {label: "Micro / DI", name: "micro", widget: "string"}
              - {label: "Support", name: "support", widget: "string", required: false, hint: "Ex. Grand pied (perche), Petit pied (perche courte), Pince / clamp, —"}
              - {label: "Notes", name: "notes", widget: "string", required: false}
              - {label: "Musicien (identifiant)", name: "musicien", widget: "string", required: false}
          - label: "Retours de scène"
            name: "retours"
            widget: "list"
            label_singular: "retour"
            collapsed: true
            summary: "{{fields.destinataire}}"
            fields:
              - {label: "Destinataire", name: "destinataire", widget: "string"}
              - {label: "Type", name: "type", widget: "string", default: "Wedge"}
              - {label: "Musicien (identifiant)", name: "musicien", widget: "string", required: false}
          - label: "Plan de scène"
            name: "plan"
            widget: "list"
            label_singular: "emplacement"
            collapsed: true
            summary: "{{fields.nom}} — {{fields.rang}}, colonne {{fields.colonne}}"
            hint: "Vue depuis le public. Colonne 1 = jardin (gauche), 5 = cour (droite)."
            fields:
              - {label: "Nom", name: "nom", widget: "string"}
              - {label: "Musicien (identifiant)", name: "musicien", widget: "string", required: false}
              - {label: "Rang", name: "rang", widget: "select", options: [{label: "Fond de scène", value: "fond"}, {label: "Milieu", value: "milieu"}, {label: "Bord de scène", value: "bord"}]}
              - {label: "Colonne (1 à 5)", name: "colonne", widget: "number", value_type: "int", min: 1, max: 5}
              - {label: "Alimentation", name: "alim", widget: "string", required: false, hint: "Ex. 230 V (ampli basse)"}
