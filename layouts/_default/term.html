{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul>
  {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}" class="text-secondary">
        {{ .Date.Format "January 2, 2006" }}
      </time>
    </li>
  {{ end }}
  </ul>
{{ end }}
